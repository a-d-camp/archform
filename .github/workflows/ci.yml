name: CI
on:
  push:
  pull_request:
jobs:
  builder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mesh checks
        run: node tests/check_mesh.js
      - name: Photo checks
        run: node tests/check_photo.js
      - name: index.html matches the sources
        run: python3 build.py --check
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests
        run: uv run pytest -q
