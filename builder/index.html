.bar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

.seg button {

  font-weight: 500; font-size: 13px; color: var(--muted); white-space: nowrap;
}

.seg button:hover { color: var(--ink); }

.btn {

  border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 500; font-size: 13px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn.armed { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }

.work { display: grid; grid-template-columns: var(--panel-w) minmax(0, 1fr); min-height: 0; }

}
.chip {

}

        for (let j = 1; j < M; j++) slant[gi(i, j)] = slopeAt(i, j);
        // On the outline itself the neighbours all lie on one side, which makes the slope jump from one
        // point to the next and the rim's lower edge ragged. Use the steepness just inside the edge.
        slant[gi(i, 0)] = slant[gi(i, 1)];
        slant[gi(i, M)] = slant[gi(i, M - 1)];
      }
      // Smooth the steepness a little (not the surface), so the underside and the rim's lower edge run
      // as smoothly as the top does.
      for (let it = 0; it < 4; it++) {
        const s2 = Float64Array.from(slant);
        for (let i = 1; i < N; i++) for (let j = 0; j <= M; j++) {
          const nb = [];
          if (i > 1) nb.push(gi(i - 1, j));
          if (i < N - 1) nb.push(gi(i + 1, j));
          if (j > 0) nb.push(gi(i, j - 1));
          if (j < M) nb.push(gi(i, j + 1));
          let a = 0;
          for (const v of nb) a += slant[v];
          s2[gi(i, j)] = 0.5 * slant[gi(i, j)] + 0.5 * a / nb.length;
        }
        slant.set(s2);
      }
      const under = new Float64Array(nSurf);
      for (let i = 1; i < N; i++) for (let j = 0; j <= M; j++) { const k = gi(i, j); under[k] = zt(k) - thick[k] * slant[k]; }
      // The two poles are points on the outline: level them with the rim on either side of them,
      // not with the whole ring (which takes in the low middle of the heel cup and notches the rim).
      const pole = (k, i) => Math.min(0.5 * (under[gi(i, 0)] + under[gi(i, M)]) + (zt(k) - 0.5 * (zt(gi(i, 0)) + zt(gi(i, M)))), zt(k) - 1);
      under[heelPole] = pole(heelPole, 1);
      under[toePole] = pole(toePole, N - 1);
      for (let k = 0; k < nSurf; k++) pos[(nSurf + k) * 3 + 2] = Math.max(0, under[k]);
    }

    // Triangles: top, bottom, then side walls
    const tris = [];
    const B = nSurf;
    const pushTop = (a, b, c) => tris.push(a, b, c);
    const pushBot = (a, b, c) => tris.push(B + a, B + c, B + b);
    // poles
    for (let j = 0; j < M; j++) {
      const r0 = gi(1, j), r1 = gi(1, j + 1);
      pushTop(heelPole, r1, r0);
      const q0 = gi(N - 1, j), q1 = gi(N - 1, j + 1);
      pushTop(toePole, q0, q1);
    }
    for (let i = 1; i < N - 1; i++) {
      for (let j = 0; j < M; j++) {
        if (cut[ci(i, j)]) continue;
        const a = gi(i, j), b = gi(i, j + 1), c = gi(i + 1, j), d = gi(i + 1, j + 1);
        pushTop(a, b, d); pushTop(a, d, c);
      }
    }
    const nTop = tris.length / 3;
    for (let j = 0; j < M; j++) {
      const r0 = gi(1, j), r1 = gi(1, j + 1);
      pushBot(heelPole, r1, r0);
      const q0 = gi(N - 1, j), q1 = gi(N - 1, j + 1);
      pushBot(toePole, q0, q1);
    }
    for (let i = 1; i < N - 1; i++) {
      for (let j = 0; j < M; j++) {
        if (cut[ci(i, j)]) continue;
        const a = gi(i, j), b = gi(i, j + 1), c = gi(i + 1, j), d = gi(i + 1, j + 1);
        pushBot(a, b, d); pushBot(a, d, c);
      }
    }
    const nBot = tris.length / 3 - nTop;
    for (let s = 0; s < loop.length; s++) {
      const u = loop[s], w = loop[(s + 1) % loop.length];
      tris.push(B + u, B + w, w);
      tris.push(B + u, w, u);
    }
    if (ho) {
      // Wall round the opening: every edge of a kept cell that borders a cut cell, wound the same
      // way as the outer wall (cell rows run i -> i+1 along x, columns j -> j+1 inner -> outer).
      const wall = (u, w) => { tris.push(B + u, B + w, w); tris.push(B + u, w, u); };
      const isCut = (i, j) => i >= 1 && i < N - 1 && j >= 0 && j < M && cut[ci(i, j)] === 1;
      for (let i = 1; i < N - 1; i++) {
        for (let j = 0; j < M; j++) {
          if (cut[ci(i, j)]) continue;
          const a = gi(i, j), b = gi(i, j + 1), c = gi(i + 1, j), d = gi(i + 1, j + 1);
          // top-surface edge directions in this cell's triangles (a,b,d) and (a,d,c): a->b, b->d, d->c, c->a
          if (isCut(i - 1, j)) wall(a, b);
          if (isCut(i, j + 1)) wall(b, d);
          if (isCut(i + 1, j)) wall(d, c);
          if (isCut(i, j - 1)) wall(c, a);
        }
      }
    }
    const tri = new Uint32Array(tris);
    if (mirror) for (let t = 0; t < tri.length; t += 3) { const tmp = tri[t + 1]; tri[t + 1] = tri[t + 2]; tri[t + 2] = tmp; }

    // Stats
    let vol = 0;
    for (let t = 0; t < tri.length; t += 3) {
      const a = tri[t] * 3, b = tri[t + 1] * 3, c = tri[t + 2] * 3;
      vol += (pos[a] * (pos[b + 1] * pos[c + 2] - pos[b + 2] * pos[c + 1]) -
        pos[a + 1] * (pos[b] * pos[c + 2] - pos[b + 2] * pos[c]) +
        pos[a + 2] * (pos[b] * pos[c + 1] - pos[b + 1] * pos[c])) / 6;
    }
    // Width is edge to edge across the whole outline, as a ruler laid across the orthotic reads it. The inner
    // and outer bulges sit at different points along the foot, so no single cross-section is this wide.
    let minY = 1e9, maxY = -1e9;
    for (let k = 0; k < nSurf; k++) { const y = pos[k * 3 + 1]; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    const maxWidth = maxY - minY;
    const outline = loop.map(k => [sx[k], mirror ? -sy[k] : sy[k]]);

    return {
      params: p, pos, tri, nSurf,
      counts: { top: nTop, bottom: nBot, wall: tri.length / 3 - nTop - nBot },
      outline,
      stats: {
        length: xe, maxWidth, maxHeight: maxTop, volume: vol / 1000, // cm^3
        weight: (vol / 1000) * DENSITY[p.material], minY, maxY
      }
    };
  }

  /* ---------- Binary STL ---------- */
  function toSTL(meshes) {
    let n = 0;
    for (const m of meshes) n += m.tri.length / 3;
    const buf = new ArrayBuffer(84 + n * 50), dv = new DataView(buf);
    const header = 'Archform - binary STL, units mm';
    for (let i = 0; i < 80; i++) dv.setUint8(i, i < header.length ? header.charCodeAt(i) : 32);
    dv.setUint32(80, n, true);
    let o = 84;
    for (const m of meshes) {
      const { pos, tri } = m, ox = m.offsetX || 0, oy = m.offsetY || 0;
      for (let t = 0; t < tri.length; t += 3) {
        const a = tri[t] * 3, b = tri[t + 1] * 3, c = tri[t + 2] * 3;
        const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
        const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        const len = Math.hypot(nx, ny, nz) || 1;
        nx /= len; ny /= len; nz /= len;
        dv.setFloat32(o, nx, true); dv.setFloat32(o + 4, ny, true); dv.setFloat32(o + 8, nz, true); o += 12;
        for (const v of [a, b, c]) {
          dv.setFloat32(o, pos[v] + ox, true); dv.setFloat32(o + 4, pos[v + 1] + oy, true);
          dv.setFloat32(o + 8, pos[v + 2], true); o += 12;
        }
        dv.setUint16(o, 0, true); o += 2;
      }
    }
    return buf;
  }


  // Each warning names the setting that tripped it, where that setting lives and
  // what to do about it. A warning you cannot act on is just noise.
  function warnings(input) {
    const p = sanitize(input), w = [];
    const n1 = v => v.toFixed(1);
    if (p.style !== 'thin') w.push('The shape is a thin moulded shell. Set Base to Thin shell under Print to match it; solid fills in underneath.');
    if (p.shellThick < 2.5 && p.material !== 'tpu') w.push(`A ${p.material.toUpperCase()} shell ${n1(p.shellThick)} mm thick can crack. Raise shell thickness to 2.5–3.5 mm under Print, or switch the material to TPU.`);
    if (Math.abs(p.archAdjHeight) > 4) w.push(`The arch is ${p.archAdjHeight > 0 ? 'raised' : 'lowered'} ${n1(Math.abs(p.archAdjHeight))} mm from the shape. Big changes are easier to judge in 2 mm steps, printing between them.`);
    return w;
  }

  // Where the arch peaks along the inner edge, and how high its top surface is there above the table.
  function archPeak(input) {
    const p = sanitize(input), ol = makeOutline(), hf = makeHeights(p, ol);
    const x = clamp(shape().arch.peak_x + p.archAdjShift, 0.5, ol.xe - 0.5);
    const [m, l] = ol.edges(x);
    return { x, top: hf(x, m, m, l, 0)[0] };
  }

  root.OrthoGeom = { DEFAULTS, LIMITS, build, toSTL, warnings, sanitize, archPeak };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" rx="8" fill="var(--accent)"/>
        <path d="M6 24h22c0-1.6-1-2.6-2.6-2.6-2.4 0-3.6-8.4-8.4-8.4S11 21.4 8.6 21.4C7 21.4 6 22.4 6 24z" fill="var(--accent-ink)" opacity=".95"/>
        <path d="M8 27h18" stroke="var(--accent-ink)" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
      </svg>
      <div>
        <h1>Archform</h1>
        <p>Adjust the arch and heel cup, then download a printable STL.</p>
      </div>
    </div>
    <div class="bar-actions">
      <button type="button" class="btn" id="reset"><span id="reset-text">Reset</span><span class="wide"> to defaults</span></button>
      <div class="seg" role="group" aria-label="Which foot">
        <button type="button" id="side-right" data-side="right">Right</button>
        <button type="button" id="side-left" data-side="left">Left</button>
        <button type="button" id="side-pair" data-side="pair">Pair</button>
      </div>
      <button type="button" class="btn primary" id="download">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v8m0 0L3.8 5.8M7 9l3.2-3.2M1.5 12.5h11" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="download-label">Download right STL</span>
      </button>
    </div>
  </header>

  <main class="work">
    <aside class="panel" id="panel" aria-label="Orthotic settings">
      <div class="alerts" id="alerts" aria-live="polite"></div>
      <div id="sections"></div>
      <div class="foot-note">
        <p><strong>Safety.</strong> These are general-purpose supports. If you have diabetes, poor circulation, numbness or ongoing foot pain, see a podiatrist before wearing them.</p>
        <div class="file-row">
          <button type="button" class="btn" id="save-settings">Save settings</button>
          <label class="btn" for="load-settings">Load settings</label>
          <input type="file" id="load-settings" accept=".json,application/json" hidden>
        </div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>
    </aside>

    <section class="stage" aria-label="3D preview">
      <div id="viewport"><div class="loading" id="loading">Loading 3D preview…</div></div>
      <div class="dims" id="dim-labels" aria-hidden="true"></div>
      <div class="readout" id="readout"></div>
      <div class="views">
        <div class="seg" role="group" aria-label="Camera view">
          <button type="button" data-view="iso" aria-pressed="true">3D</button>
          <button type="button" data-view="top">Top</button>
          <button type="button" data-view="side">Inner side</button>
          <button type="button" data-view="back">Heel</button>
        </div>
        <div class="legend">
          <label><input type="checkbox" id="dims" checked> Dimensions</label>
          <label><input type="checkbox" id="heatmap" checked> Height colours</label>
          <span class="ramp-wrap" id="ramp-wrap"><span>0</span><span class="ramp"></span><span id="ramp-max">18 mm</span></span>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
/* ---------- Settings UI (no 3D dependency, so the controls work even if the preview cannot load) ---------- */
(function () {
  const G = window.OrthoGeom;
  const STORE_KEY = 'scan-free-orthotic-designer.v1';

  const SECTIONS = [
    { id: 'shape', title: 'Shape', sub: 'Adjust the arch', fields: [
      { type: 'note', text: 'A thin moulded 3/4-length shell with a deep heel cup, a tall inner arch and a heel opening, fitted to a 3D scan. These sliders adjust it; at zero you get the shape exactly.' },
      { k: 'archAdjHeight', label: 'Arch height change', unit: 'mm', step: 0.5, hint: 'Raises (+) or lowers (-) the orthotic\'s arch surface, most at the inner edge under the peak, fading smoothly along the foot and across it. This changes the support\'s height, not a measurement of your foot.' },
      { k: 'archAdjShift', label: 'Arch position change', unit: 'mm', step: 1, hint: 'Moves the arch toward the toes (+) or the heel (-).' },
      { k: 'archAdjLength', label: 'Arch length change', unit: '%', step: 1, hint: 'Stretches (+) or shortens (-) the arch along the foot.' },
      { k: 'archAdjReach', label: 'Arch change reaches across', unit: '%', step: 5, hint: 'How far from the inner edge toward the outer edge an arch height change carries. Lower keeps it to the inner flange; 100 lifts or lowers the whole midfoot.' },
      { k: 'outerAdj', label: 'Outer side change', unit: 'mm', step: 0.5, hint: 'Raises (+) or lowers (-) the outer side under the arch.' },
      { k: 'heelAdj', label: 'Heel cup change', unit: 'mm', step: 0.5, hint: 'Deepens (+) or flattens (-) the heel cup walls.' }
    ]},
    { id: 'print', title: 'Print', sub: 'Build and material', fields: [
      { type: 'choice', k: 'style', label: 'Base', options: [['thin', 'Thin shell'], ['solid', 'Solid, flat base']],
        hints: { thin: 'The same thickness everywhere, like a moulded shell: the heel cup and arch are rounded underneath and only touch the shoe where they are low. Lightest. Needs supports under the heel cup and arch.', solid: 'Filled in flat underneath, so it prints with no supports. Heavier and stiffer. Best in TPU.' } },
      { k: 'shellThick', label: 'Shell thickness', unit: 'mm', step: 0.1, hint: 'Thickness of the shell.' },
      { type: 'choice', k: 'material', label: 'Material', options: [['tpu', 'TPU 95A'], ['petg', 'PETG'], ['pla', 'PLA']],
        hints: {
          tpu: 'Flexible and durable. 2–3 walls, 15–25% gyroid infill, print slowly at 20–30 mm/s.',
          petg: 'Firm shell. 4 walls, 30–40% infill. Add a foam top cover for comfort.',
          pla: 'Brittle under repeated flexing. Good for test fits; print the final pair in TPU or PETG.' } }
    ]}
  ];

  let params = Object.assign({}, G.DEFAULTS);
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved && typeof saved === 'object') params = G.sanitize(saved);
  } catch (e) { /* storage unavailable */ }

  const listeners = [];
  const App = window.OrthoApp = {
    get params() { return params; },
    set(patch, opts) {
      params = G.sanitize(Object.assign({}, params, patch));
      syncControls();
      try { localStorage.setItem(STORE_KEY, JSON.stringify(params)); } catch (e) { /* ignore */ }
      listeners.forEach(fn => fn(params, opts || {}));
    },
    onChange(fn) { listeners.push(fn); },
    status(msg) { const el = document.getElementById('status'); el.textContent = msg; }
  };

  const fmt = (v, step) => (step < 1 ? Number(v).toFixed(1) : String(Math.round(v)));
  const host = document.getElementById('sections');
  const ranges = {}, nums = {}, choices = {};

  function el(tag, attrs, html) {
    const e = document.createElement(tag);
    if (attrs) for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (html != null) e.innerHTML = html;
    return e;
  }

  for (const sec of SECTIONS) {
    const d = el('details', { class: 'sec', id: 'sec-' + sec.id, open: '' });
    const s = el('summary');
    s.append(el('span', { class: 'sec-title' }, sec.title), el('span', { class: 'sec-sub' }, sec.sub));
    d.append(s);
    const body = el('div', { class: 'sec-body' });
    for (const f of sec.fields) {
      if (f.type === 'note') { body.append(el('p', { class: 'hint' }, f.text)); continue; }
      if (f.type === 'choice') { body.append(buildChoice(f)); continue; }
      const [min, max] = G.LIMITS[f.k];
      const wrap = el('div', { class: 'field', 'data-k': f.k });
      const head = el('div', { class: 'field-head' });
      head.append(el('label', { for: 'r-' + f.k }, f.label));
      const num = el('span', { class: 'num' });
      const n = el('input', { type: 'number', id: 'n-' + f.k, min, max, step: f.step, inputmode: 'decimal', 'aria-label': f.label + ' value' });
      num.append(n, document.createTextNode(f.unit));
      head.append(num);
      const r = el('input', { type: 'range', id: 'r-' + f.k, min, max, step: f.step });
      wrap.append(head, r, el('p', { class: 'hint' }, f.hint));
      body.append(wrap);
      ranges[f.k] = r; nums[f.k] = n; r._step = f.step;
      r.addEventListener('input', () => App.set({ [f.k]: Number(r.value) }));
      n.addEventListener('change', () => { if (n.value !== '') App.set({ [f.k]: Number(n.value) }); });
    }
    d.append(body);
    host.append(d);
  }

  function buildChoice(f) {
    const wrap = el('div', { class: 'choice' });
    wrap.append(el('span', { class: 'field-head' }, '<span style="font-weight:500">' + f.label + '</span>'));
    const seg = el('div', { class: 'seg', role: 'group', 'aria-label': f.label });
    for (const [val, text] of f.options) {
      const b = el('button', { type: 'button', id: 'c-' + f.k + '-' + val }, text);
      b.addEventListener('click', () => App.set({ [f.k]: val }));
      seg.append(b);
    }
    const hint = el('p', { class: 'hint' });
    wrap.append(seg, hint);
    choices[f.k] = { seg, hint, hints: f.hints };
    return wrap;
  }

  function syncControls() {
    for (const k in ranges) {
      const r = ranges[k], [min, max] = G.LIMITS[k];
      r.value = params[k];
      r.style.setProperty('--fill', ((params[k] - min) / (max - min) * 100).toFixed(1) + '%');
      if (document.activeElement !== nums[k]) nums[k].value = fmt(params[k], r._step);
    }
    for (const k in choices) {
      const c = choices[k];
      for (const b of c.seg.querySelectorAll('button')) b.setAttribute('aria-pressed', b.id === 'c-' + k + '-' + params[k] ? 'true' : 'false');
      c.hint.textContent = c.hints[params[k]] || '';
    }
    for (const b of document.querySelectorAll('[data-side]')) b.setAttribute('aria-pressed', b.dataset.side === params.side ? 'true' : 'false');
    const label = params.side === 'pair' ? 'Download pair STL' : 'Download ' + params.side + ' STL';
    document.getElementById('download-label').textContent = label;
    const alerts = document.getElementById('alerts');
    alerts.innerHTML = '';
    for (const w of G.warnings(params)) alerts.append(el('div', { class: 'alert' }, w));
  }

  for (const b of document.querySelectorAll('[data-side]')) b.addEventListener('click', () => App.set({ side: b.dataset.side }, { refit: true }));

  /* ---------- Settings files and downloads ---------- */
  function settingsJSON() {
    return JSON.stringify({ app: 'orthotics-builder', version: 1, params }, null, 2);
  }
  function fileStem(side) {
    return `orthotic-${side}`;
  }
  function stlFor(side) {
    if (side === 'pair') {
      const r = G.build(params, { side: 'right' }), l = G.build(params, { side: 'left' });
      const gap = 8;
      return G.toSTL([
        Object.assign(r, { offsetY: -(r.stats.maxY + gap) }),
        Object.assign(l, { offsetY: -l.stats.minY + gap })
      ]);
    }
    return G.toSTL([G.build(params, { side })]);
  }
  const README = () => [
    'Archform export',
    '',
    'Units: millimetres. The base sits flat on Z = 0, toes point along +X.',
    'Print with the base on the bed. Thin shell needs supports under the heel cup and arch; solid needs none.',
    'settings.json reloads these exact values with "Load settings".',
    '',
    'General-purpose supports only. See a podiatrist if you have diabetes, poor circulation,',
    'numbness or ongoing foot pain.'
  ].join('\n');

  // Downloads: inside Claude the page asks the viewer to save a .zip; hosted anywhere else it downloads directly.
  async function offerFile(filename, data, standaloneName, standaloneData) {
    if (!window.claude || typeof window.claude.use !== 'function') {
      const blob = new Blob([standaloneData || data]);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = standaloneName || filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return 'saved';
    }
    const dl = await window.claude.use('downloads');
    if (!dl) throw { code: 'unavailable' };
    const res = await dl.save({ filename, data });
    return res.status;
  }
  function explain(err) {
    const code = err && err.code;
    if (code === 'declined') return 'Download cancelled.';
    if (code === 'rate_limited') return 'A save prompt is already open. Finish that one first.';
    if (code === 'too_large') return 'The file is too large for this destination.';
    return 'Downloads are not available in this view. Open the page in claude.ai or a browser to save files.';
  }

  const dlBtn = document.getElementById('download');
  dlBtn.addEventListener('click', async () => {
    dlBtn.disabled = true;
    App.status('Building the mesh…');
    try {
      const side = params.side;
      const stl = stlFor(side);
      const stem = fileStem(side);
      const zip = new JSZip();
      zip.file(stem + '.stl', stl);
      zip.file('settings.json', settingsJSON());
      zip.file('README.txt', README());
      const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
      const status = await offerFile(stem + '.zip', blob, stem + '.stl', stl);
      App.status(status === 'saved' ? 'Saved ' + stem + (window.claude ? '.zip (STL, settings and notes).' : '.stl.') : 'Sent.');
    } catch (e) {
      App.status(explain(e));
    } finally {
      dlBtn.disabled = false;
    }
  });

  document.getElementById('save-settings').addEventListener('click', async () => {
    try {
      await offerFile('orthotic-settings.json', settingsJSON());
      App.status('Saved orthotic-settings.json.');
    } catch (e) { App.status(explain(e)); }
  });
  document.getElementById('load-settings').addEventListener('change', async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const p = data && data.params ? data.params : data;
      if (!p || typeof p !== 'object') throw new Error('no params');
      App.set(p, { refit: true });
      App.status('Loaded settings from ' + file.name + '.');
    } catch (e) {
      App.status('That file is not a settings file from this tool. Choose a settings.json it exported.');
    }
    ev.target.value = '';
  });
  // Reset sits next to Download now, so it asks first rather than wiping a design
  // on a stray click. Two taps, no dialog in the way.
  const resetBtn = document.getElementById('reset');
  const resetText = document.getElementById('reset-text');
  const disarm = () => { resetText.textContent = 'Reset'; resetBtn.classList.remove('armed'); };
  let resetArmed = 0;
  resetBtn.addEventListener('click', () => {
    if (Date.now() - resetArmed > 4000) {
      resetArmed = Date.now();
      resetText.textContent = 'Click again to reset';
      resetBtn.classList.add('armed');
      App.status('Click reset again to go back to the default settings.');
      setTimeout(() => {
        if (Date.now() - resetArmed >= 4000) disarm();
      }, 4100);
      return;
    }
    resetArmed = 0;
    disarm();
    App.set(Object.assign({}, G.DEFAULTS, { side: params.side }), { refit: true });
    App.status('Back to the default settings.');
  });

  syncControls();
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const G = window.OrthoGeom, App = window.OrthoApp;
const host = document.getElementById('viewport');
document.getElementById('loading').remove();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
host.append(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 1, 6000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.12;
controls.screenSpacePanning = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9590, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(-180, 260, 420);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.55);
rim.position.set(300, -260, 120);
scene.add(rim);

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const surfMat = new THREE.MeshStandardMaterial({ roughness: 0.62, metalness: 0, side: THREE.FrontSide });
const wallMat = new THREE.MeshStandardMaterial({ roughness: 0.7, metalness: 0 });
let grid = null;

function applyTheme() {
  scene.background = new THREE.Color(css('--stage'));
  wallMat.color.set(css('--model-base'));
  dimMat.color.set(css('--ink'));
  if (!heat) surfMat.color.set(css('--model'));
  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  grid = new THREE.GridHelper(600, 60, css('--grid'), css('--grid'));
  grid.rotation.x = Math.PI / 2;
  grid.position.z = -0.05;
  grid.material.transparent = true;
  grid.material.opacity = 0.9;
  scene.add(grid);
  needsRender = true;
}

/* ---------- Mesh objects, one per foot ---------- */
const feet = {};
function footObject(side) {
  if (feet[side]) return feet[side];
  const group = new THREE.Group();
  const surf = new THREE.Mesh(new THREE.BufferGeometry(), surfMat);
  const wall = new THREE.Mesh(new THREE.BufferGeometry(), wallMat);
  group.add(surf, wall);
  scene.add(group);
  return (feet[side] = { group, surf, wall, indexed: false, last: null });
}

const RAMP = ['#2B3F94', '#2C8FA0', '#66BC6A', '#F0D04A', '#E0613A'].map(c => new THREE.Color(c));
function rampColor(t, out) {
  const s = Math.min(0.9999, Math.max(0, t)) * (RAMP.length - 1), i = Math.floor(s), f = s - i;
  return out.copy(RAMP[i]).lerp(RAMP[i + 1], f);
}

// Height colours are on unless this viewer turned them off last time
let heat = true;
try { heat = localStorage.getItem('orthotics-builder.heat') !== 'off'; } catch (e) { /* storage unavailable */ }
document.getElementById('heatmap').checked = heat;
document.getElementById('ramp-wrap').hidden = !heat;

/* ---------- Dimensions drawn on the model ---------- */
// Lines live in the scene so they sit against the geometry; the numbers are HTML
// over the top, so they stay crisp, upright and in the page's own type.
let dims = true;
try { dims = localStorage.getItem('orthotics-builder.dims') !== 'off'; } catch (e) { /* storage unavailable */ }
document.getElementById('dims').checked = dims;
const dimGroup = new THREE.Group();
scene.add(dimGroup);
const dimMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.85 });
const dimHost = document.getElementById('dim-labels');
let dimMarks = [];

function addDim(a, b, tick, text) {
  const g = new THREE.BufferGeometry().setFromPoints([a, b, a, a.clone().add(tick), b, b.clone().add(tick)]);
  const line = new THREE.LineSegments(g, dimMat);
  dimGroup.add(line);
  const el = document.createElement('div');
  el.className = 'dim-label';
  el.textContent = text;
  dimHost.append(el);
  dimMarks.push({ el, line, a: a.clone(), b: b.clone(), mid: a.clone().lerp(b, 0.5) });
}

function buildDims(stats, oy) {
  for (const c of dimGroup.children) c.geometry.dispose();
  dimGroup.clear();
  dimHost.textContent = '';
  dimMarks = [];
  if (!dims || !stats) return;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const L = stats.length, H = stats.maxHeight;
  const yLo = stats.minY + oy, yHi = stats.maxY + oy;
  // The views all look at the foot from its inner side, so the dimensions go there
  // too, where they are in front of the model instead of hidden behind it.
  const near = App.params.side === 'left' ? -1 : 1;
  const gap = Math.max(10, stats.maxWidth * 0.12), tick = gap * 0.4;
  const yOut = (near > 0 ? yHi : yLo) + gap * near;
  addDim(V(0, yOut, 0), V(L, yOut, 0), V(0, 0, tick), L.toFixed(0) + ' mm long');
  addDim(V(-gap, yLo, 0), V(-gap, yHi, 0), V(0, 0, tick), stats.maxWidth.toFixed(0) + ' mm wide');
  addDim(V(-gap, yOut, 0), V(-gap, yOut, H), V(tick, 0, 0), H.toFixed(1) + ' mm tall');
  // The arch, standing at the point along the foot where it actually peaks: the
  // height of the inner edge's top surface above the table there.
  const pk = G.archPeak(App.params);
  addDim(V(pk.x, yOut, 0), V(pk.x, yOut, pk.top), V(tick, 0, 0), pk.top.toFixed(1) + ' mm arch');
}

// Put each number on its line, and drop any dimension the camera is looking
// straight down the barrel of, where it would read as a dot. That is an angle to
// the view axis, not a length on screen: zooming out should not lose a dimension.
const dimV = new THREE.Vector3(), dimDir = new THREE.Vector3(), camDir = new THREE.Vector3();
function layoutDims() {
  if (!dimMarks.length) return;
  const w = host.clientWidth, h = host.clientHeight;
  // This runs before the renderer touches the camera, so bring its matrices up to
  // date first. Rendering only on demand means a stale frame here would stick.
  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  camera.getWorldDirection(camDir);
  const at = v => {
    dimV.copy(v).project(camera);
    return { x: (dimV.x * 0.5 + 0.5) * w, y: (-dimV.y * 0.5 + 0.5) * h, behind: dimV.z > 1 };
  };
  for (const m of dimMarks) {
    const a = at(m.a), b = at(m.b), c = at(m.mid);
    dimDir.subVectors(m.b, m.a).normalize();
    const endOn = Math.abs(dimDir.dot(camDir)) > 0.93;    // within about 20 degrees of the view axis
    const show = !c.behind && !endOn && Math.hypot(b.x - a.x, b.y - a.y) > 16;
    m.line.visible = show;
    m.el.style.display = show ? '' : 'none';
    if (!show) continue;
    m.el.style.left = c.x.toFixed(1) + 'px';
    m.el.style.top = c.y.toFixed(1) + 'px';
  }
}

function updateFoot(side, mesh) {
  const o = footObject(side);
  o.last = mesh;
  const nTris = mesh.counts.top + mesh.counts.bottom;
  const sg = o.surf.geometry;
  sg.setAttribute('position', new THREE.BufferAttribute(mesh.pos, 3));
  sg.setIndex(new THREE.BufferAttribute(mesh.tri.subarray(0, nTris * 3), 1));
  sg.computeVertexNormals();
  if (heat) {
    const n = mesh.pos.length / 3, col = new Float32Array(n * 3), c = new THREE.Color(), base = new THREE.Color(css('--model-base'));
    const maxH = Math.max(1, mesh.stats.maxHeight);
    for (let k = 0; k < n; k++) {
      if (k < mesh.nSurf) rampColor(mesh.pos[k * 3 + 2] / maxH, c); else c.copy(base);
      col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
    }
    sg.setAttribute('color', new THREE.BufferAttribute(col, 3));
  } else if (sg.getAttribute('color')) sg.deleteAttribute('color');
  sg.computeBoundingSphere();

  // walls: flat-shaded, own vertices so the edge stays crisp
  const wt = mesh.tri.subarray(nTris * 3), wp = new Float32Array(wt.length * 3);
  for (let i = 0; i < wt.length; i++) {
    const v = wt[i] * 3;
    wp[i * 3] = mesh.pos[v]; wp[i * 3 + 1] = mesh.pos[v + 1]; wp[i * 3 + 2] = mesh.pos[v + 2];
  }
  const wg = o.wall.geometry;
  wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
  wg.computeVertexNormals();
  wg.computeBoundingSphere();
}

/* ---------- Rebuild on change ---------- */
let pending = false, refitNext = true, needsRender = true, view = 'iso';
function schedule(opts) {
  if (opts && opts.refit) refitNext = true;
  if (pending) return;
  pending = true;
  requestAnimationFrame(rebuild);
}

function rebuild() {
  pending = false;
  const p = App.params;
  const sides = p.side === 'pair' ? ['left', 'right'] : [p.side];
  const built = {};
  for (const s of sides) built[s] = G.build(p, { side: s });
  for (const s of ['left', 'right']) {
    const o = footObject(s);
    o.group.visible = sides.includes(s);
    if (built[s]) updateFoot(s, built[s]);
  }
  // Arrange a pair side by side, inner edges facing each other
  const gap = 10;
  if (p.side === 'pair') {
    feet.right.group.position.y = -(built.right.stats.maxY + gap);
    feet.left.group.position.y = -built.left.stats.minY + gap;
  } else {
    for (const s of ['left', 'right']) feet[s].group.position.y = 0;
  }
  surfMat.vertexColors = heat;
  surfMat.color.set(heat ? '#ffffff' : css('--model'));
  surfMat.needsUpdate = true;

  const st = built[sides[0]].stats;
  document.getElementById('ramp-max').textContent = st.maxHeight.toFixed(1) + ' mm';
  const matName = { tpu: 'TPU', petg: 'PETG', pla: 'PLA' }[p.material];
  const per = sides.length > 1 ? ' each' : '';
  document.getElementById('readout').innerHTML =
    `<span class="chip">Length <b>${st.length.toFixed(0)} mm</b></span>` +
    `<span class="chip">Width <b>${st.maxWidth.toFixed(0)} mm</b></span>` +
    `<span class="chip">Tallest point <b>${st.maxHeight.toFixed(1)} mm</b></span>` +
    `<span class="chip">Solid volume <b>${st.volume.toFixed(0)} cm³</b>${per} · up to <b>${st.weight.toFixed(0)} g</b> ${matName}</span>`;

  buildDims(st, feet[sides[0]].group.position.y);

  if (refitNext) { setView(view); refitNext = false; }
  needsRender = true;
}

function bounds() {
  const box = new THREE.Box3();
  for (const s of ['left', 'right']) if (feet[s] && feet[s].group.visible) box.expandByObject(feet[s].group);
  // Frame the dimensions too, or they sit off the edge the moment they are on.
  if (dims && dimGroup.children.length) box.expandByObject(dimGroup);
  return box;
}

function setView(v) {
  view = v;
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', b.dataset.view === v ? 'true' : 'false');
  const box = bounds();
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const span = Math.max(size.x, size.y * 1.25, 60);
  const fovR = THREE.MathUtils.degToRad(camera.fov);
  const aspect = Math.max(0.4, camera.aspect);
  let dist = (span / 2) / Math.tan(fovR / 2) * 1.25;
  if (aspect < 1) dist /= Math.max(0.55, aspect);
  const p = App.params;
  const inner = p.side === 'left' ? -1 : 1;  // +Y is the inner side of a right foot
  let dir;
  switch (v) {
    case 'top': dir = new THREE.Vector3(-0.0015, 0, 1); break;
    case 'side': dir = p.side === 'pair' ? new THREE.Vector3(-1, 0, 0.18) : new THREE.Vector3(0, inner, 0.14); break;
    case 'back': dir = new THREE.Vector3(-1, 0, 0.16); dist *= 0.75; break;
    default: dir = p.side === 'pair' ? new THREE.Vector3(-0.85, 0.15, 0.95) : new THREE.Vector3(-0.55, 0.85 * inner, 0.62);
  }
  c.z = Math.min(c.z, 6);
  controls.target.copy(c);
  camera.position.copy(c).addScaledVector(dir.normalize(), dist);
  camera.lookAt(c);
  controls.update();
  needsRender = true;
}

for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => setView(b.dataset.view));
document.getElementById('dims').addEventListener('change', e => {
  dims = e.target.checked;
  try { localStorage.setItem('orthotics-builder.dims', dims ? 'on' : 'off'); } catch (err) { /* ignore */ }
  schedule();
});
document.getElementById('heatmap').addEventListener('change', e => {
  heat = e.target.checked;
  document.getElementById('ramp-wrap').hidden = !heat;
  try { localStorage.setItem('orthotics-builder.heat', heat ? 'on' : 'off'); } catch (err) { /* ignore */ }
  schedule();
});

/* ---------- Resize, theme and render loop ---------- */
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  needsRender = true;
}
new ResizeObserver(resize).observe(host);
resize();

const mq = window.matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener('change', () => { applyTheme(); schedule(); });
new MutationObserver(() => { applyTheme(); schedule(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
applyTheme();

controls.addEventListener('change', () => { needsRender = true; });
(function loop() {
  requestAnimationFrame(loop);
  if (controls.update()) needsRender = true;
  if (needsRender) { layoutDims(); renderer.render(scene, camera); needsRender = false; }
})();

App.onChange((p, opts) => schedule(opts));
schedule({ refit: true });
window.__orthoReady = true;
</script>
</body>
