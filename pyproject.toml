[project]
name = "archform"
version = "0.1.0"
description = "Spline-surface orthotic shells: fit to reference measurements, adjust, export STL"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.scripts]
ortho = "ortho.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ortho"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
